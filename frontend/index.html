<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjoMan</title>
    <!-- Apply the cached theme before first paint, so dark mode doesn't flash light -->
    <script>
      try { if (localStorage.getItem("pm-theme") === "DARK") document.documentElement.classList.add("dark") } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
